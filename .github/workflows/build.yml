name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Ready-to-run Windows .exe, no DLLs needed. Pushing a v* tag attaches it to a release.
  windows-exe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -static usercheck.cpp -o usercheck.exe -lwinhttp
      - uses: actions/upload-artifact@v4
        with:
          name: usercheck-windows
          path: usercheck.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: usercheck.exe

  # Makes sure the CMake build works everywhere (MSVC on Windows).
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
