name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. v1.0.0 (leave empty to just build)"
        required: false
        default: ""

jobs:
  # Ready-to-run Windows .exe, no DLLs needed. Pushing a v* tag, or running this
  # workflow by hand with a release tag, publishes it as a GitHub release.
  windows-exe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -static ringer.cpp -o ringer.exe -lwinhttp
      - uses: actions/upload-artifact@v4
        with:
          name: ringer-windows
          path: ringer.exe
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ringer.exe

  # Makes sure the CMake build works everywhere (MSVC on Windows).
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
